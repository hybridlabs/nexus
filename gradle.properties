# Important Notes:
# fabric.mod.json's modid field cannot be expanded, you must change it manually.

# Project
version=1.1.0
group=dev.hybridlabs.hapi
java_version=17
kotlin_version=2.1.20

# Common
minecraft_version=1.20.1
mod_name=Hybrid API
mod_author=Hybrid Labs
mod_id=hapi
license=MIT

credits=MysticKoko, Aqua, Andante, Eggo, murphy slaw, Ragno

description=A library mod used by the Hybrid Labs suite

# https://parchmentmc.org/docs/getting-started#choose-a-version
parchment_version=2023.09.03

# Dependencies
geckolib_version=1.20.1:4.8.2

# Fabric
loom_version=1.17.20
fabric_version=0.92.6+1.20.1
fabric_loader_version=0.18.2

# Forge
forge_version=47.4.10
minecraft_version_range=[1.20.1, 1.22)
forge_loader_version_range=[47,)

# Build tooling (versions are resolved in settings.gradle pluginManagement)
moddev_version=2.0.147
foojay_version=1.0.0
mod_publish_version=2.2.0

# Gradle
# Daemon reuse, parallel execution and the local build cache are the three settings that dominate
# incremental build time on a multi-subproject mod. jvmargs is sized for the Minecraft
# decompile/remap steps, which are the memory-hungry part of the build.
org.gradle.jvmargs=-Xmx6G -XX:MaxMetaspaceSize=1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Toolchains are provisioned by the foojay resolver declared in settings.gradle, so the build no
# longer depends on the developer's JAVA_HOME matching java_version.
org.gradle.java.installations.auto-download=true
